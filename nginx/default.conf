# UltraDoc AI reverse proxy.
#   /                    -> web:3000 (Next.js)
#   /api/backend-health  -> web:3000 (Next.js's own route, must not hit FastAPI)
#   /api/*               -> api:8000 with the /api prefix stripped
#
# Container names "web" and "api" resolve on the shared Docker network.

# 10 requests/second per client IP for the API; bursts are queued below.
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
limit_req_status 429;

# Don't advertise the nginx version on any response.
server_tokens off;

# Only send "Connection: upgrade" when the client asked for a websocket.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream web_upstream {
    server web:3000;
}

upstream api_upstream {
    server api:8000;
}

# ---- HTTP: redirect everything to HTTPS ----
server {
    listen 80;
    listen [::]:80;
    server_name _;

    # Lets the container healthcheck probe nginx without TLS.
    location = /nginx-health {
        access_log off;
        return 200 "ok\n";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---- HTTPS ----
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/selfsigned.crt;
    ssl_certificate_key /etc/nginx/certs/selfsigned.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1h;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_vary on;
    gzip_types text/plain text/css text/javascript application/javascript
               application/json application/xml image/svg+xml;

    # Matches MAX_UPLOAD_MB=10 on the API.
    client_max_body_size 10m;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Set here, not per-location: any proxy_set_header inside a location
    # would drop every header inherited from this level.
    proxy_set_header Upgrade           $http_upgrade;
    proxy_set_header Connection        $connection_upgrade;

    # Next.js route, not a FastAPI one: exact match beats the /api/ prefix.
    location = /api/backend-health {
        proxy_pass http://web_upstream;
    }

    location /api/ {
        limit_req zone=api_limit burst=20 nodelay;

        # Trailing slash on proxy_pass strips the /api prefix:
        # /api/upload -> http://api:8000/upload
        proxy_pass http://api_upstream/;

        # /ask and /extract wait on the LLM; allow slow responses.
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    location / {
        proxy_pass http://web_upstream;
    }
}
